<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="estilo/media-queries.css">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Membros VMT</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem"></div>
            <div id="forms">
                <h1>Miau-in</h1>
                <p>Identifique-se, humano! Os gatos precisam confirmar se você é membro.</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="email" id="iemal" placeholder="digite seu e-mail" required autocomplete="email">
                        <label for="iemal">@</label>
                    </div>
                    <div class="campo">
                         <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="senha" id="isen" placeholder="digite sua senha" required minlength="8" autocomplete="current-password">
                         <label for="isen">s</label>
                    </div>
                    <input type="submit" value="Enviar">
                    <a href="esqueci.html" class="butao">Esqueci a senha <span class="material-symbols-outlined">mail</span></a>
                   
                </form>
            </div>
        </section>
    </main>
</body>
</html>
